services:
  - type: web
    name: xinxiang-jieqi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DB_PATH
        value: /tmp/xinxiang-quiz.sqlite
